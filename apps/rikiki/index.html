<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rikiki</title>
<meta name="description" content="Score sheet for the card game Rikiki: bids, tricks, points and past games.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==== jnssn-ui css: generated by scripts/ui.mjs — do not edit by hand, run `node scripts/build.mjs --sync-ui` ==== */
:root{
  color-scheme:light dark;
  --h:352;

  /* surfaces — neutrals carry a slight cool bias so they read as chosen */
  --bg:#F4F5F8; --surface:#FFFFFF; --raised:#FFFFFF; --inset:#EDEFF4;
  --line:#DFE3EC; --line-soft:#EAEDF3;

  /* ink */
  --text:#14161C; --dim:#5C6376; --faint:#8C93A6;

  /* accent, from the app's own hue */
  --accent:hsl(var(--h) 64% 42%);
  --accent-ink:#FFFFFF;
  --accent-wash:hsl(var(--h) 72% 96%);
  --accent-edge:hsl(var(--h) 52% 84%);

  /* semantic — separate from the accent on purpose */
  --pos:hsl(152 58% 32%); --neg:hsl(356 68% 46%);
  --pos-wash:hsl(152 52% 95%); --neg-wash:hsl(356 82% 96%);

  /* elevation. The inner top highlight is what makes a panel read as a
     physical object instead of a flat rectangle; it matters most in dark. */
  --lift:0 1px 2px hsl(var(--h) 24% 12% / .06), 0 4px 14px hsl(var(--h) 24% 12% / .05);
  --lift-hi:0 2px 4px hsl(var(--h) 24% 12% / .08), 0 12px 32px hsl(var(--h) 24% 12% / .10);
  --edge:inset 0 1px 0 hsl(0 0% 100% / .7);

  /* geometry */
  --r-sm:9px; --r:14px; --r-lg:20px; --r-full:999px;
  --tap:48px;

  /* motion. Expo-out for movement, a slight overshoot for presses. Both are
     applied to transform and opacity only, so they stay on the compositor. */
  --fast:130ms; --mid:220ms; --slow:340ms;
  --ease:cubic-bezier(.16,1,.3,1);
  --spring:cubic-bezier(.34,1.42,.64,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0C10; --surface:#14161C; --raised:#1A1D25; --inset:#0E1015;
  --line:#262A34; --line-soft:#1E212A;
  --text:#ECEEF3; --dim:#959CAF; --faint:#6B7286;
  --accent:hsl(var(--h) 76% 64%);
  --accent-ink:#0B0C10;
  --accent-wash:hsl(var(--h) 40% 16%);
  --accent-edge:hsl(var(--h) 40% 28%);
  --pos:hsl(152 62% 56%); --neg:hsl(356 92% 70%);
  --pos-wash:hsl(152 36% 14%); --neg-wash:hsl(356 42% 16%);
  --lift:0 1px 2px #0006, 0 6px 18px #0007;
  --lift-hi:0 2px 6px #0007, 0 18px 44px #0009;
  --edge:inset 0 1px 0 hsl(0 0% 100% / .06);}}
:root[data-theme="dark"]{--bg:#0B0C10; --surface:#14161C; --raised:#1A1D25; --inset:#0E1015;
  --line:#262A34; --line-soft:#1E212A;
  --text:#ECEEF3; --dim:#959CAF; --faint:#6B7286;
  --accent:hsl(var(--h) 76% 64%);
  --accent-ink:#0B0C10;
  --accent-wash:hsl(var(--h) 40% 16%);
  --accent-edge:hsl(var(--h) 40% 28%);
  --pos:hsl(152 62% 56%); --neg:hsl(356 92% 70%);
  --pos-wash:hsl(152 36% 14%); --neg-wash:hsl(356 42% 16%);
  --lift:0 1px 2px #0006, 0 6px 18px #0007;
  --lift-hi:0 2px 6px #0007, 0 18px 44px #0009;
  --edge:inset 0 1px 0 hsl(0 0% 100% / .06);}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;height:100%}
body{
  font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.45;color:var(--text);background:var(--bg);
  min-height:100%;-webkit-tap-highlight-color:transparent;
  text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
.wrap{max-width:480px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{line-height:1.15;text-wrap:balance;font-weight:700;letter-spacing:-.02em}
h1{font-size:28px}
h2{font-size:19px;letter-spacing:-.01em}
h3{font-size:15px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.02em}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.dim{color:var(--dim)}.faint{color:var(--faint)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.stack{display:flex;flex-direction:column;gap:10px}
.stack-lg{display:flex;flex-direction:column;gap:22px}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}

/* --- surfaces --------------------------------------------------------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--lift),var(--edge)}
.card.flat{box-shadow:none}
.card.quiet{background:transparent;box-shadow:none;border-color:var(--line-soft)}
.pad{padding:14px 16px}
.list>*{border-top:1px solid var(--line-soft)}
.list>*:first-child{border-top:0}

.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:var(--tap)}
.grow{min-width:0;flex:1}
/* display:block so these read the same whether the app emits div or span */
.row .title{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{display:block;font-size:13px;color:var(--dim);margin-top:1px}
.row.lead{background:var(--accent-wash)}

/* --- controls ---------------------------------------------------------- */
button,input,select{font:inherit;color:inherit}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:54px;padding:0 20px;border:1px solid transparent;border-radius:var(--r);
  background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16.5px;
  letter-spacing:-.01em;cursor:pointer;box-shadow:var(--lift);
  transition:transform var(--fast) var(--spring),opacity var(--fast) linear,background var(--fast) linear;
}
.btn:active:not(:disabled){transform:scale(.972)}
.btn:disabled{opacity:.38;cursor:default;box-shadow:none}
.btn.ghost{background:var(--surface);color:var(--text);border-color:var(--line);box-shadow:var(--lift),var(--edge)}
.btn.quiet{background:transparent;color:var(--dim);border-color:transparent;box-shadow:none;min-height:var(--tap);font-size:15px}
.btn.danger{background:transparent;color:var(--neg);border-color:var(--line);box-shadow:none}
.btn.sm{min-height:40px;font-size:14.5px;padding:0 14px;border-radius:var(--r-full);width:auto}
.btns{display:grid;gap:10px}
.btns.two{grid-template-columns:1fr 1fr}

/* Stepper. The value is the biggest thing in the row because it is the thing
   being read back; the buttons are quiet until touched. */
.stepper{display:flex;align-items:center;gap:2px;flex:none;background:var(--inset);border-radius:var(--r-full);padding:3px}
.stepper button{
  width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:50%;
  background:transparent;color:var(--accent);cursor:pointer;
  transition:transform var(--fast) var(--spring),background var(--fast) linear;
}
.stepper button:active:not(:disabled){transform:scale(.86);background:var(--accent-wash)}
.stepper button:disabled{opacity:.22;cursor:default}
.stepper .val{min-width:40px;text-align:center;font-size:22px;font-weight:700}

.toggle{
  width:52px;height:32px;flex:none;border-radius:var(--r-full);border:0;cursor:pointer;
  background:var(--inset);position:relative;box-shadow:inset 0 0 0 1px var(--line);
  transition:background var(--mid) var(--ease),box-shadow var(--mid) var(--ease);
}
.toggle::after{
  content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;
  background:var(--surface);box-shadow:0 1px 3px #0003;
  transition:transform var(--mid) var(--spring);
}
.toggle[aria-pressed="true"]{background:var(--accent);box-shadow:none}
.toggle[aria-pressed="true"]::after{transform:translateX(20px)}

/* Segmented control — the language bar and any 2-3 way choice. */
.seg{display:flex;background:var(--inset);border-radius:var(--r-full);padding:3px;gap:2px;flex:none}
.seg button{
  border:0;background:transparent;color:var(--dim);cursor:pointer;border-radius:var(--r-full);
  padding:7px 13px;min-height:36px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  transition:color var(--fast) linear,background var(--mid) var(--ease);
}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--lift)}

.field{
  width:100%;min-height:var(--tap);padding:12px 14px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--inset);color:var(--text);
  font-size:16px;-webkit-appearance:none;
  transition:border-color var(--fast) linear,background var(--fast) linear;
}
.field::placeholder{color:var(--faint)}
.field:focus{outline:none;border-color:var(--accent);background:var(--surface)}

.chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--r-full);
  background:var(--inset);color:var(--dim);font-size:12.5px;font-weight:600;white-space:nowrap;
}
/* Outlined, not filled. Red/green are reserved for good/bad, and an app whose
   own hue lands in the red band (rikiki is 352) would otherwise have its
   accent chip read as a failure. Semantic colour stays semantic. */
.chip.on{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-edge)}
.chip.bad{background:var(--neg-wash);color:var(--neg)}
.chip.good{background:var(--pos-wash);color:var(--pos)}

:where(a,button,input,select,summary):focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}

/* --- progress ----------------------------------------------------------
   Dots, not a bar: a game has a countable number of rounds, and the count is
   information the player wants. Past 14 it falls back to a bar. */
.dots{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:transform var(--mid) var(--spring),background var(--mid) linear}
.dots i.done{background:var(--accent);opacity:.45}
.dots i.now{background:var(--accent);transform:scale(1.62)}
.bar{height:5px;border-radius:var(--r-full);background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width var(--slow) var(--ease)}

/* --- table -------------------------------------------------------------- */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:center;white-space:nowrap;border-top:1px solid var(--line-soft)}
thead th{position:sticky;top:0;background:var(--surface);font-size:13px;font-weight:600;border-top:0;border-bottom:1px solid var(--line);vertical-align:bottom}
tbody th{position:sticky;left:0;background:var(--surface);color:var(--faint);font-size:12.5px;font-weight:500;text-align:left;width:1%}

/* --- feedback ----------------------------------------------------------- */
.empty{padding:26px 18px;text-align:center;color:var(--dim);font-size:14.5px}
#toast{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:40;padding:0 14px}
#toast .t{
  display:flex;align-items:center;gap:14px;max-width:440px;width:100%;
  background:var(--raised);color:var(--text);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 14px;box-shadow:var(--lift-hi),var(--edge);
  pointer-events:auto;font-size:14.5px;
  animation:toast-in var(--slow) var(--ease) both;
}
#toast .t.out{animation:toast-out var(--mid) var(--ease) both}
#toast .t span{flex:1;min-width:0}
#toast .t button{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:14.5px;cursor:pointer;padding:6px 2px;flex:none}
@keyframes toast-in{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toast-out{to{opacity:0;transform:translateY(8px) scale(.98)}}

/* --- motion ------------------------------------------------------------- */
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.rise{animation:rise var(--slow) var(--ease) both}
.rise:nth-child(2){animation-delay:40ms}
.rise:nth-child(3){animation-delay:80ms}
.rise:nth-child(4){animation-delay:120ms}
.rise:nth-child(5){animation-delay:160ms}
@keyframes bump{50%{transform:scale(1.22)}}
.bump{animation:bump var(--mid) var(--spring)}

/* --- app shell ----------------------------------------------------------
   Every app has a bar and a stack of screens, whatever it is a game of. An
   app that hand-rolls these is the first step towards five design systems. */
.appbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid transparent;
  transition:border-color var(--mid) var(--ease);
}
.appbar.stuck{border-bottom-color:var(--line)}
.appbar h1{font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appbar .act{
  width:40px;height:40px;flex:none;display:grid;place-items:center;border:0;border-radius:50%;
  background:transparent;color:var(--dim);cursor:pointer;
  transition:transform var(--fast) var(--spring),background var(--fast) linear,color var(--fast) linear;
}
.appbar .act:active{transform:scale(.88);background:var(--inset)}
.appbar .act:hover{color:var(--text)}

/* Screens are siblings; exactly one is visible. Toggle with el.hidden, never
   style.display, so assistive tech follows along. */
.screen[hidden]{display:none}
.screen:focus{outline:none}
.screen{animation:rise var(--slow) var(--ease) both}

/* --- dialog -------------------------------------------------------------
   Native <dialog>: focus trapping, Esc to close and inertness come free and
   correct. Hand-rolled modals get all three wrong. */
dialog.sheet{
  border:0;padding:0;background:transparent;max-width:480px;width:100%;
  margin:auto auto 0;max-height:88svh;
}
dialog.sheet::backdrop{background:#0009;backdrop-filter:blur(3px);animation:fade var(--mid) var(--ease) both}
dialog.sheet>.body{
  background:var(--raised);border:1px solid var(--line);border-bottom:0;
  border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--lift-hi),var(--edge);
  padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));
  max-height:88svh;overflow-y:auto;overscroll-behavior:contain;
  animation:sheet-up var(--slow) var(--ease) both;
}
dialog.sheet>.body::before{
  content:"";display:block;width:36px;height:4px;border-radius:2px;
  background:var(--line);margin:6px auto 14px;
}
dialog.sheet h2{margin-bottom:12px}
@keyframes sheet-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (min-width:520px){
  dialog.sheet{margin:auto}
  dialog.sheet>.body{border-radius:var(--r-lg);border-bottom:1px solid var(--line);animation-name:rise}
  dialog.sheet>.body::before{display:none}
}

/* --- tabs ---------------------------------------------------------------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  border:0;background:transparent;color:var(--dim);cursor:pointer;white-space:nowrap;
  padding:12px 14px;min-height:var(--tap);font-size:14.5px;font-weight:600;
  border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:color var(--fast) linear,border-color var(--mid) var(--ease);
}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

/* --- board --------------------------------------------------------------
   A square grid, for anything played on tiles: words, memory, puzzles,
   minesweeper. Set --cols; the cells size themselves. */
.board{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:var(--gap,8px)}
.tile{
  aspect-ratio:1;display:grid;place-items:center;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--surface);box-shadow:var(--edge);
  font-size:min(7vw,22px);font-weight:700;cursor:pointer;color:var(--text);
  transition:transform var(--fast) var(--spring),background var(--fast) linear,border-color var(--fast) linear;
}
.tile:active:not(:disabled){transform:scale(.94)}
.tile[aria-pressed="true"],.tile.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile:disabled{opacity:.4;cursor:default}
.tile.flat{background:var(--inset);box-shadow:none}

/* --- stat ---------------------------------------------------------------
   For the one or two figures that ARE the point of the screen. Used for
   everything, it flattens the hierarchy instead of creating one. */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.stat{padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--edge)}
.stat .k{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.stat .v{display:block;font-size:30px;font-weight:700;letter-spacing:-.03em;margin-top:3px;font-variant-numeric:tabular-nums}

/* Anything a screen reader must hear but nobody should see. */
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* Installed to the Home Screen: no browser chrome, so the bar carries more. */
@media (display-mode:standalone){.appbar{padding-top:calc(14px + env(safe-area-inset-top,0px))}}

/* Cross-screen transitions. Supported browsers animate; the rest just swap. */
::view-transition-old(root){animation:vt-out var(--mid) var(--ease) both}
::view-transition-new(root){animation:vt-in var(--slow) var(--ease) both}
@keyframes vt-out{to{opacity:0;transform:translateY(-6px)}}
@keyframes vt-in{from{opacity:0;transform:translateY(10px)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}
  ::view-transition-old(root),::view-transition-new(root){animation:none}
}
/* ==== /jnssn-ui css ==== */

/* ---------- rikiki's own CSS ----------
   Everything above belongs to scripts/ui.mjs. These are the few things only a
   trick-taking score sheet needs; all of them are built from the kit's tokens. */

/* The round header: the card count is the single biggest thing on the screen,
   because it is what players look up between every hand. */
.roundhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.cards{font-size:34px;font-weight:700;letter-spacing:-.03em;margin-top:2px}
.meta{font-size:13.5px;color:var(--dim);text-align:right;line-height:1.5}
.meta b{color:var(--text);font-weight:600}

/* One row per player. The value is the biggest thing in it, being what gets
   read back around the table. */
.who{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--inset);color:var(--dim);font-size:13px;font-weight:700}
.row.lead .av{background:var(--accent);color:var(--accent-ink)}

/* The sheet. First column sticks so a name stays attached to its score when
   six players push the table sideways. */
.tot{display:block;font-size:22px;font-weight:700;margin-top:2px;letter-spacing:-.03em}
thead th.first .tot{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
/* Not scoped to td: the round column is a <th scope="row">, and scoping these
   to td is what made the number run into its label ("11 card"). */
.d{display:block;font-size:16px;font-weight:600}
.bm{display:block;font-size:11.5px;color:var(--faint);margin-top:1px;font-weight:400}

/* Standings. Rank and points bracket the name. */
.rank{font-size:22px;font-weight:700;width:26px;flex:none;color:var(--faint);font-variant-numeric:tabular-nums}
.row.first .rank{color:var(--accent)}
.pts{font-size:26px;font-weight:700;flex:none;letter-spacing:-.03em;font-variant-numeric:tabular-nums}

/* Past games, collapsed. The kit has no accordion; this is the one place that
   wants one, so it stays local rather than going into the kit for a single use. */
details.past{border-top:1px solid var(--line-soft)}
details.past:first-child{border-top:0}
details.past summary{list-style:none;cursor:pointer;padding:12px 14px;min-height:var(--tap);display:flex;flex-direction:column;justify-content:center}
details.past summary::-webkit-details-marker{display:none}
details.past summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pd{font-size:12.5px;color:var(--faint)}
.pl{font-weight:600;font-size:14.5px;margin-top:1px}
details.past[open] summary{background:var(--inset)}

.nameinput{flex:1;min-width:0;border:0;background:transparent;color:var(--text);
  font:600 16px/1.3 inherit;padding:11px 2px;border-bottom:1.5px solid var(--line)}
.nameinput::placeholder{color:var(--faint);font-weight:400}
.nameinput:focus{outline:none;border-bottom-color:var(--accent)}
.x{width:40px;height:40px;flex:none;border:0;background:transparent;color:var(--faint);cursor:pointer;
  border-radius:50%;display:grid;place-items:center;transition:transform var(--fast) var(--spring),color var(--fast) linear}
.x:active{transform:scale(.88);color:var(--neg)}
</style>
<script>
/* Shared language runtime. The key is origin-wide, so choosing a language here
   also changes the index and every other game. Kept inside the app rather than
   injected at build time so that opening this file straight from a git clone
   still works. */
(function(){
  var K='jnssn-lang', LANGS=['en','fr'], DEF='en';
  function stored(){ try{ return localStorage.getItem(K); }catch(e){ return null; } }
  function initial(){
    var s=stored(); if(LANGS.indexOf(s)>-1) return s;
    var nav=(navigator.languages||[navigator.language||'']).join(',').toLowerCase();
    for(var i=0;i<LANGS.length;i++) if(nav.indexOf(LANGS[i])>-1) return LANGS[i];
    return DEF;
  }
  var cur=initial();
  document.documentElement.lang=cur;
  window.JLang={
    langs:LANGS,
    get:function(){ return cur; },
    set:function(l){
      if(LANGS.indexOf(l)<0||l===cur) return;
      cur=l; document.documentElement.lang=l;
      try{ localStorage.setItem(K,l); }catch(e){}
      window.dispatchEvent(new CustomEvent('jlangchange',{detail:l}));
    }
  };
})();
</script>
</head>
<body>

<header class="appbar">
  <a class="act" href="/" id="homelink" aria-label="All games"></a>
  <h1 id="apptitle">Rikiki</h1>
  <div class="seg" id="langslot" role="group" aria-label="Language"></div>
  <button class="act" type="button" id="openrules" aria-label="Game rules"></button>
</header>

<main class="wrap">

  <!-- ===== setup ===== -->
  <section class="screen stack-lg" id="setup">
    <div>
      <h2 id="whoh">Who plays?</h2>
      <p class="dim" id="dealorder" style="margin-top:4px"></p>
    </div>
    <div class="stack">
      <div class="card list" id="playerlist"></div>
      <button class="btn ghost" id="addplayer"></button>
    </div>
    <button class="btn" id="start"></button>
    <div id="hist-setup"></div>
  </section>

  <!-- ===== game ===== -->
  <section class="screen stack-lg" id="game" hidden>
    <div>
      <div class="roundhead">
        <div>
          <div class="eyebrow" id="roundof"></div>
          <div class="cards num" id="cardcount"></div>
        </div>
        <div class="meta" id="meta"></div>
      </div>
      <div class="dots" id="dots" aria-hidden="true" style="margin-top:12px"></div>
    </div>

    <div>
      <div class="seg" id="phasebar" role="group" style="width:100%">
        <button type="button" data-phase="bids" aria-pressed="true" style="flex:1"></button>
        <button type="button" data-phase="tricks" aria-pressed="false" style="flex:1"></button>
      </div>
      <div class="card list" id="rows" style="margin-top:12px"></div>
      <p class="dim" id="status" role="status" style="margin:12px 2px;font-size:14px;text-align:center"></p>
      <button class="btn" id="cta"></button>
    </div>

    <div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
        <h2 id="sheeth"></h2>
        <button class="btn ghost sm" id="order" hidden></button>
      </div>
      <div class="card" id="sheet" style="margin-top:10px"></div>
    </div>

    <div class="btns two">
      <button class="btn ghost" id="back"></button>
      <button class="btn danger" id="stop"></button>
    </div>
  </section>

  <!-- ===== done ===== -->
  <section class="screen stack-lg" id="done" hidden>
    <div>
      <h2 id="doneh" style="font-size:28px"></h2>
      <p class="dim" id="donesub" style="margin-top:4px"></p>
    </div>
    <div>
      <h2 id="standh" style="margin-bottom:10px"></h2>
      <div class="card list" id="podium"></div>
    </div>
    <div class="card" id="donesheet"></div>
    <div class="btns">
      <button class="btn" id="again"></button>
      <button class="btn ghost" id="fixlast"></button>
      <button class="btn quiet" id="tosetup"></button>
    </div>
    <div id="hist-done"></div>
  </section>
</main>

<!-- Game rules. A sheet rather than a <details> block: the rules are read once
     at the start and then never again, so they should not take up room on the
     setup screen for the rest of the game. -->
<dialog class="sheet" id="rules">
  <div class="body">
    <h2 id="rulesh"></h2>
    <div class="card list">
      <div class="row">
        <div class="grow">
          <span class="title" id="l-max"></span>
          <span class="sub" id="l-rounds"></span>
        </div>
        <div class="stepper" data-cfg="max">
          <button type="button" data-d="-1" aria-label="-"></button>
          <span class="val num" id="v-max">0</span>
          <button type="button" data-d="1" aria-label="+"></button>
        </div>
      </div>
      <div class="row">
        <div class="grow"><span class="title" id="l-down"></span></div>
        <button class="toggle" type="button" data-tog="down" aria-pressed="true"></button>
      </div>
      <div class="row">
        <div class="grow">
          <span class="title" id="l-forbid"></span>
          <span class="sub" id="l-forbidnote"></span>
        </div>
        <button class="toggle" type="button" data-tog="forbid" aria-pressed="true"></button>
      </div>
      <div class="row">
        <div class="grow"><span class="title" id="l-bonus"></span></div>
        <div class="stepper" data-cfg="bonus">
          <button type="button" data-d="-1" aria-label="-"></button>
          <span class="val num" id="v-bonus">0</span>
          <button type="button" data-d="1" aria-label="+"></button>
        </div>
      </div>
      <div class="row">
        <div class="grow"><span class="title" id="l-per"></span></div>
        <div class="stepper" data-cfg="per">
          <button type="button" data-d="-1" aria-label="-"></button>
          <span class="val num" id="v-per">0</span>
          <button type="button" data-d="1" aria-label="+"></button>
        </div>
      </div>
      <div class="row">
        <div class="grow"><span class="title" id="l-pen"></span></div>
        <div class="stepper" data-cfg="pen">
          <button type="button" data-d="-1" aria-label="-"></button>
          <span class="val num" id="v-pen">0</span>
          <button type="button" data-d="1" aria-label="+"></button>
        </div>
      </div>
    </div>
    <div class="btns" style="margin-top:14px">
      <button class="btn ghost" id="closerules"></button>
    </div>
  </div>
</dialog>

<!-- One confirm, reused. Stopping a game and clearing the history are both
     destructive and not undoable in one tap, which is the case a dialog is
     actually for; everything else uses an undo toast instead. -->
<dialog class="sheet" id="confirm">
  <div class="body">
    <h2 id="confirmh"></h2>
    <p class="dim" id="confirmbody" style="margin-bottom:16px"></p>
    <div class="btns two">
      <button class="btn ghost" id="confirmno"></button>
      <button class="btn danger" id="confirmyes"></button>
    </div>
  </div>
</dialog>

      roundOf:function(i,n){ return 'Manche ' + i + ' sur ' + n; },

    en: {

  /* t('key')            -> a plain string

    var v = D()[k];
    if(v && typeof v === 'object' && v.other !== undefined) return plural(lang(), arguments[1], v);
    if(typeof v !== 'function') return v;
    return v.apply(null, Array.prototype.slice.call(arguments, 1));

  }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(!raw) return null;
      var s = JSON.parse(raw);
      if(!s || !s.players || !s.cfg || !s.rounds) return null;
      if(s.phase==='play'){ s.phase='tricks'; if(s.cur) s.cur.made = s.cur.bids.slice(); }

  // State lives on this device only. localStorage can throw or come back empty
  // (private browsing, cleared site data), so every access is guarded and the
  // app must stay usable when it fails.
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

  var S = load() || fresh();
  if(S.phase!=='setup' && !S.id) S.id = 'g'+Date.now();

  // Rolling buffer of the last 5 games, newest first. Separate key so a corrupt game can't take it down.
  var HKEY = 'rikiki-history-v1', HMAX = 5;
  var MEMH = null;
  function loadHistory(){
    if(MEMH) return MEMH;
    try{ var a = JSON.parse(localStorage.getItem(HKEY) || '[]'); MEMH = Array.isArray(a) ? a : []; }catch(e){ MEMH = []; }
    return MEMH;
  }
  function archive(finished){
    if(!S.id || !S.rounds.length) return;
    var H = loadHistory().filter(function(g){ return g.id !== S.id; });
    H.unshift({id:S.id, ts:Date.now(), finished:!!finished, players:S.players.slice(),
               cfg:{bonus:S.cfg.bonus, per:S.cfg.per, pen:S.cfg.pen}, rounds:JSON.parse(JSON.stringify(S.rounds))});
    MEMH = H.slice(0, HMAX);
    try{ localStorage.setItem(HKEY, JSON.stringify(MEMH)); }catch(e){}
  }
  function when(ts){
    try{ return new Date(ts).toLocaleString(t('locale'), {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}); }
    catch(e){ return new Date(ts).toDateString(); }
  }

  /* ---------- game logic ----------
     Unchanged from the previous version. It was correct; only the view moved. */
  function esc(x){ return String(x).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function sum(a){ return a.reduce(function(x,y){ return x+y; }, 0); }
  function sign(n){ return n>0 ? '+'+n : (n<0 ? '−'+Math.abs(n) : '0'); }
  function hardMax(n){ return Math.floor(52/n); }
  function autoMax(n){ return Math.min(10, Math.floor(51/n)); }
  function maxCards(){
    var n = S.players.length, m = S.cfg.max==null ? autoMax(n) : S.cfg.max;
    return Math.max(1, Math.min(m, hardMax(n)));
  }
  function seq(){
    var m = maxCards(), a = [], i;
    for(i=1;i<=m;i++) a.push(i);
    if(S.cfg.down) for(i=m-1;i>=1;i--) a.push(i);
    return a;
  }
  function points(bid, made, cfg){ cfg = cfg || S.cfg; return bid===made ? cfg.bonus + cfg.per*made : -cfg.pen*Math.abs(bid-made); }
  function totals(g){
    g = g || S;
    var tt = g.players.map(function(){ return 0; });
    g.rounds.forEach(function(r){ r.bids.forEach(function(b,i){ tt[i] += points(b, r.made[i], g.cfg); }); });
    return tt;
  }
  function roundInfo(){
    var i = S.rounds.length, n = S.players.length, s = seq();
    var dealer = i % n, order = [];
    for(var k=1;k<=n;k++) order.push((dealer+k)%n);
    return {idx:i, count:s.length, cards:s[i], dealer:dealer, order:order};
  }
  function zeros(){ return S.players.map(function(){return 0;}); }
  function newCur(){ return {bids:zeros(), made:zeros()}; }
  // skip = a value the stepper may never land on (the dealer's forbidden bid)
  function nextAllowed(v, d, min, max, skip){
    var n = v + d; if(n===skip) n += d;
    return (n<min || n>max) ? null : n;
  }
  // The dealer's forbidden bid for the current round, or null when nothing is forbidden.
  function forbiddenBid(R){
    if(!S.cfg.forbid) return null;
    var f = R.cards - (sum(S.cur.bids) - S.cur.bids[R.dealer]);
    return (f>=0 && f<=R.cards) ? f : null;
  }
  // Never leave the dealer sitting on the forbidden number.
  function fixDealer(R){
    var f = forbiddenBid(R), b = S.cur.bids;
    if(f!=null && b[R.dealer]===f) b[R.dealer] = (f+1<=R.cards) ? f+1 : f-1;
  }

  var $ = function(id){ return document.getElementById(id); };

  /* ---------- rendering ----------
     THE RULE: markup is written once and the nodes that change are patched.
     A stepper tap calls paintRound(), which touches a handful of text nodes —
     it never rebuilds the screen. Rows are rebuilt only when their SHAPE
     changes, which is once per round, not once per tap. */

  function stepperHtml(kind, i, v, min, max, skip){
    if(skip==null) skip = -99;
    return '<div class="stepper" data-kind="'+kind+'" data-i="'+i+'">'+
      '<button type="button" data-d="-1" aria-label="'+esc(t('less'))+'"'+(nextAllowed(v,-1,min,max,skip)==null?' disabled':'')+'>'+UI.icon('minus',20)+'</button>'+
      '<span class="val num" aria-live="polite">'+v+'</span>'+
      '<button type="button" data-d="1" aria-label="'+esc(t('more'))+'"'+(nextAllowed(v,1,min,max,skip)==null?' disabled':'')+'>'+UI.icon('plus',20)+'</button>'+
    '</div>';
  }

  function initials(n){ return (n||'?').trim().slice(0,1).toUpperCase() || '?'; }

  // Rebuilt once per round, or when the phase flips. Not on a tap.
  function mountRound(){
    var R = roundInfo(), c = S.cur, isBids = S.phase==='bids', h = '';
    R.order.forEach(function(i){
      var isDealer = i===R.dealer;
      h += '<div class="row'+(isDealer && isBids ? ' lead':'')+'" data-row="'+i+'">'+
        '<span class="who"><span class="av">'+esc(initials(S.players[i]))+'</span>'+
        '<span class="grow"><span class="title">'+esc(S.players[i])+'</span>'+
        '<span class="sub" data-note="'+i+'"></span></span></span>'+
        stepperHtml(isBids?'bid':'made', i, isBids?c.bids[i]:c.made[i], 0, R.cards, null)+
      '</div>';
    });
    $('rows').innerHTML = h;
    paintRound();
  }

  // Called after every tap. Touches only what changed.
  function paintRound(){
    var R = roundInfo(), c = S.cur, isBids = S.phase==='bids';
    var forbidden = null;
    if(isBids){ fixDealer(R); forbidden = forbiddenBid(R); }

    R.order.forEach(function(i){
      var isDealer = i===R.dealer;
      var v = isBids ? c.bids[i] : c.made[i];
      var row = $('rows').querySelector('[data-row="'+i+'"]');
      if(!row) return;

      UI.setText(row.querySelector('.val'), v);
      var skip = (isBids && isDealer && forbidden!=null) ? forbidden : -99;
      UI.setAttr(row.querySelector('[data-d="-1"]'), 'disabled', nextAllowed(v,-1,0,R.cards,skip)==null);
      UI.setAttr(row.querySelector('[data-d="1"]'),  'disabled', nextAllowed(v, 1,0,R.cards,skip)==null);

      var note = row.querySelector('[data-note="'+i+'"]');
      if(isBids){
        if(isDealer && S.cfg.forbid) note.innerHTML = forbidden!=null
          ? '<span class="chip bad">'+esc(t('banned',forbidden))+'</span>'
          : '<span class="chip">'+esc(t('dealerFree'))+'</span>';
        else if(isDealer) note.textContent = t('dealerLast');
        else note.textContent = '';
      }else{
        var p = points(c.bids[i], c.made[i]);
        note.innerHTML = '<span class="chip">'+esc(t('bidChip',c.bids[i]))+'</span> '+
          '<span class="chip '+(p<0?'bad':'good')+'">'+esc(t('pts',sign(p)))+'</span>';
      }
    });

    // Header, status and the call to action all read from the same numbers.
    UI.setText($('roundof'), t('roundOf', R.idx+1, R.count));
    UI.setText($('cardcount'), t('cards', R.cards));
    $('meta').innerHTML = t('deals', esc(S.players[R.dealer])) + '<br>' + t('leads', esc(S.players[R.order[0]]));

    var ok, msg;
    if(isBids){
      var tb = sum(c.bids);
      ok = !(S.cfg.forbid && tb===R.cards);
      msg = ok ? t('totalBids', tb, t('cards',R.cards)) : t('totalBad', R.cards, S.players[R.dealer]);
    }else{
      var diff = R.cards - sum(c.made);
      ok = diff===0;
      msg = ok ? t('countsOk') : (diff>0 ? t('needMore', t('tricks',diff), t('cards',R.cards)) : t('tooMany', t('tricks',-diff)));
    }
    UI.setText($('status'), msg);
    $('status').className = ok ? 'dim' : 'neg';
    UI.setText($('cta'), isBids ? t('confirmBids') : t('confirmRound'));
    UI.setAttr($('cta'), 'disabled', !ok);

    $('phasebar').querySelectorAll('[data-phase]').forEach(function(b){
      b.setAttribute('aria-pressed', b.dataset.phase === S.phase);
    });
    // Only "go back to bids" is reachable from the tricks phase.
    UI.setAttr($('phasebar').querySelector('[data-phase="bids"]'), 'disabled', isBids);
    UI.setAttr($('phasebar').querySelector('[data-phase="tricks"]'), 'disabled', true);
    UI.setAttr($('back'), 'disabled', isBids && !S.rounds.length);

    $('dots').innerHTML = R.count <= 14
      ? Array.from({length:R.count}, function(_,k){
          return '<i class="'+(k<R.idx?'done':k===R.idx?'now':'')+'"></i>'; }).join('')
      : '<div class="bar" style="width:100%"><i style="width:'+Math.round(R.idx/R.count*100)+'%"></i></div>';

    save();
  }

  function tableHtml(g, stack){
    var tt = totals(g), best = Math.max.apply(null, tt), h = '';
    if(!g.rounds.length) return '<div class="empty">'+esc(t('sheetEmpty'))+'</div>';
    h += '<div class="scroll"><table><thead><tr><th scope="col"></th>';
    g.players.forEach(function(p,i){
      h += '<th scope="col" class="'+(tt[i]===best?'first':'')+'">'+esc(p)+
           '<span class="tot num'+(tt[i]<0?' neg':'')+'">'+tt[i]+'</span></th>';
    });
    h += '</tr></thead><tbody>';
    var list = g.rounds.map(function(r,k){ return {r:r,k:k}; });
    if(stack) list.reverse();
    list.forEach(function(o){
      var r = o.r;
      h += '<tr><th scope="row">'+(o.k+1)+'<span class="bm">'+esc(t('cards',r.cards))+'</span></th>';
      r.bids.forEach(function(b,i){
        var d = points(b, r.made[i], g.cfg);
        h += '<td><span class="d num '+(d<0?'neg':'pos')+'">'+sign(d)+'</span><span class="bm num">'+b+' / '+r.made[i]+'</span></td>';
      });
      h += '</tr>';
    });
    return h + '</tbody></table></div>';
  }

  function paintSheet(){
    var stack = S.cfg.stack !== false;
    $('sheet').innerHTML = tableHtml(S, stack);
    var btn = $('order');
    btn.hidden = S.rounds.length < 2;
    UI.setText(btn, (stack ? t('latestTop') : t('firstTop')) + ' ⇅');
  }

  function paintPlayers(){
    var n = S.players.length;
    $('playerlist').innerHTML = S.players.map(function(p,i){
      return '<div class="row">'+
        '<input class="nameinput" type="text" autocomplete="off" autocapitalize="words" maxlength="14" '+
        'data-name="'+i+'" value="'+esc(p)+'" placeholder="'+esc(t('playerN',i+1))+'" aria-label="'+esc(t('playerLabel',i+1))+'">'+
        (n>2 ? '<button class="x" type="button" data-rm="'+i+'" aria-label="'+esc(t('removePlayer'))+'">'+UI.icon('x',18)+'</button>' : '')+
      '</div>';
    }).join('');
    $('addplayer').hidden = n >= 7;
  }

  function paintDone(){
    var tt = totals(), order = S.players.map(function(_,i){return i;}).sort(function(a,b){ return tt[b]-tt[a]; });
    var rank = 0, prev = null;
    $('podium').innerHTML = order.map(function(i,k){
      if(tt[i]!==prev){ rank = k+1; prev = tt[i]; }
      return '<div class="row'+(rank===1?' first':'')+'">'+
        '<span class="rank">'+rank+'</span>'+
        '<span class="grow"><span class="title">'+esc(S.players[i])+'</span></span>'+
        '<span class="pts'+(tt[i]<0?' neg':'')+'">'+tt[i]+'</span></div>';
    }).join('');
    UI.setText($('donesub'), t('rounds', S.rounds.length));
    $('donesheet').innerHTML = tableHtml(S, false);
  }

  function paintHistory(){
    var inGame = S.phase!=='setup';
    var H = loadHistory().filter(function(g){ return !(inGame && g.id===S.id); });
    var h = '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px">'+
              '<h2>'+esc(t('recent'))+'</h2>'+
              (H.length ? '<button class="btn ghost sm" data-clearh="1">'+esc(t('clear'))+'</button>' : '')+
            '</div>'+
            '<p class="faint" style="margin:6px 2px 10px;font-size:12.5px">'+esc(t('localOnly'))+'</p>';
    if(!H.length){
      h += '<div class="card quiet"><div class="empty">'+esc(t('noHistory'))+'</div></div>';
    }else{
      h += '<div class="card">' + H.map(function(g){
        var tt = totals(g), order = g.players.map(function(_,i){return i;}).sort(function(a,b){ return tt[b]-tt[a]; });
        var line = order.map(function(i){ return esc(g.players[i])+' '+tt[i]; }).join(', ');
        return '<details class="past"><summary><span class="pd">'+esc(when(g.ts))+(g.finished?'':esc(t('stopped')))+'</span>'+
               '<span class="pl">'+line+'</span></summary><div>'+tableHtml(g, false)+'</div></details>';
      }).join('') + '</div>';
    }
    var target = inGame ? 'hist-done' : 'hist-setup';
    $(target).innerHTML = h;
    // Recent games belong where a game is not in progress. On the game screen
    // the live sheet is already the thing to read.
    $(inGame ? 'hist-setup' : 'hist-done').innerHTML = '';
  }

  /* Every visible string is re-applied rather than baked in at load, because
     the language can change at any moment, from here or from the index. */
  function paintText(){
    document.documentElement.lang = lang();
    document.title = t('docTitle');
    UI.setAttr($('homelink'), 'aria-label', t('home'));
    UI.setAttr($('openrules'), 'aria-label', t('rules'));
    UI.setText($('whoh'), t('who'));
    UI.setText($('dealorder'), t('dealOrder'));
    UI.setText($('addplayer'), t('addPlayer'));
    UI.setText($('start'), t('start'));
    UI.setText($('sheeth'), t('theSheet'));
    UI.setText($('back'), t('goBack'));
    UI.setText($('stop'), t('stopGame'));
    UI.setText($('doneh'), t('done'));
    UI.setText($('standh'), t('standings'));
    UI.setText($('again'), t('again'));
    UI.setText($('fixlast'), t('fixLast'));
    UI.setText($('tosetup'), t('changePlayers'));
    UI.setText($('rulesh'), t('rules'));
    UI.setText($('closerules'), t('close'));
    UI.setText($('l-max'), t('maxCards'));
    UI.setText($('l-down'), t('upDown'));
    UI.setText($('l-forbid'), t('forbid'));
    UI.setText($('l-forbidnote'), t('forbidNote'));
    UI.setText($('l-bonus'), t('ptsHit'));
    UI.setText($('l-per'), t('ptsPer'));
    UI.setText($('l-pen'), t('ptsPen'));
    $('phasebar').querySelector('[data-phase="bids"]').textContent = t('phase1');
    $('phasebar').querySelector('[data-phase="tricks"]').textContent = t('phase2');
    langBar();
    paintAll();
  }

  function langBar(){
    var l = window.JLang, slot = $('langslot');
    if(!l || l.langs.length < 2){ slot.hidden = true; return; }
    slot.innerHTML = l.langs.map(function(c){
      return '<button type="button" data-lang="'+c+'" aria-pressed="'+(c===l.get())+'">'+c+'</button>';
    }).join('');
  }

  function paintRules(){
    UI.setText($('v-max'), maxCards());
    UI.setText($('l-rounds'), t('roundsTotal', seq().length));
    ['bonus','per','pen'].forEach(function(k){ UI.setText($('v-'+k), S.cfg[k]); });
    document.querySelectorAll('[data-tog]').forEach(function(b){
      b.setAttribute('aria-pressed', !!S.cfg[b.dataset.tog]);
    });
    // The rules are fixed once a game is under way; changing them mid-game
    // would silently rescore rounds already played.
    var live = S.phase!=='setup';
    document.querySelectorAll('#rules .stepper button, #rules [data-tog]').forEach(function(b){
      UI.setAttr(b, 'disabled', live || null);
    });
  }

  // The whole screen, for a change of screen or language. Individual taps use
  // the narrower painters above.
  function paintAll(){
    if(S.phase==='setup'){ paintPlayers(); }
    else if(S.phase==='done'){ paintDone(); }
    else { mountRound(); paintSheet(); }
    paintRules();
    paintHistory();
    save();
  }

  function show(){
    UI.screen(S.phase==='setup' ? 'setup' : S.phase==='done' ? 'done' : 'game');
    $('openrules').hidden = false;
  }

  /* ---------- confirm ---------- */
  var onYes = null;
  function ask(title, body, label, fn){
    UI.setText($('confirmh'), title);
    UI.setText($('confirmbody'), body);
    UI.setText($('confirmyes'), label);
    UI.setText($('confirmno'), t('cancel'));
    onYes = fn;
    UI.openSheet('confirm');
  }

  /* ---------- wiring ---------- */
  $('homelink').innerHTML = UI.icon('back', 20);
  $('openrules').innerHTML = UI.icon('cog', 20);

  document.addEventListener('input', function(e){
    var i = e.target.getAttribute && e.target.getAttribute('data-name');
    if(i!=null){
      S.players[+i] = e.target.value;
      // Patch the avatar in place; re-rendering the list would take the
      // keyboard down mid-word.
      var av = e.target.parentNode.querySelector('.av');
      if(av) av.textContent = initials(e.target.value);
      save();
    }
  });

  document.addEventListener('click', function(e){
    var lb = e.target.closest('[data-lang]');
    if(lb){ if(window.JLang) window.JLang.set(lb.getAttribute('data-lang')); return; }

    var b = e.target.closest('button');
    if(!b || b.disabled) return;

    // Steppers: the hot path. Patch, never rebuild.
    var st = b.closest('.stepper');
    if(st){
      var d = +b.dataset.d;
      if(st.dataset.kind){
        var R = roundInfo(), i = +st.dataset.i;
        if(st.dataset.kind==='bid'){
          var skip = (i===R.dealer) ? forbiddenBid(R) : null;
          var n = nextAllowed(S.cur.bids[i], d, 0, R.cards, skip==null ? -99 : skip);
          if(n!=null) S.cur.bids[i] = n;
          fixDealer(R);
        }else{
          S.cur.made[i] = Math.max(0, Math.min(R.cards, S.cur.made[i]+d));
        }
        paintRound();
        UI.live(S.players[i] + ': ' + (S.phase==='bids' ? S.cur.bids[i] : S.cur.made[i]));
      }else{
        var k = st.dataset.cfg;
        if(k==='max') S.cfg.max = Math.max(1, Math.min(hardMax(S.players.length), maxCards()+d));
        else S.cfg[k] = Math.max(0, Math.min(k==='bonus'?50:20, S.cfg[k]+d));
        paintRules(); save();
      }
      return;
    }

    if(b.dataset.tog){ S.cfg[b.dataset.tog] = !S.cfg[b.dataset.tog]; paintRules(); save(); return; }
    if(b.dataset.rm){ if(S.players.length>2){ S.players.splice(+b.dataset.rm,1); paintPlayers(); paintRules(); save(); } return; }
    if(b.dataset.phase === 'bids' && S.phase === 'tricks'){ S.phase='bids'; mountRound(); save(); return; }
    if(b.dataset.clearh){
      ask(t('clearTitle'), t('clearBody'), t('clear'), function(){
        MEMH = []; try{ localStorage.removeItem(HKEY); }catch(e){}
        paintHistory();
      });
      return;
    }

    switch(b.id){
      case 'addplayer':
        if(S.players.length<7){ S.players.push(''); paintPlayers(); paintRules(); save(); }
        break;

      case 'start':
        S.players = S.players.map(function(p,j){ return p.trim() || t('playerN', j+1); });
        S.cfg.max = maxCards(); S.rounds = []; S.cur = newCur(); S.phase = 'bids'; S.id = 'g'+Date.now();
        paintAll(); show();
        break;

      case 'cta':
        if(S.phase==='bids'){
          S.cur.made = S.cur.bids.slice();
          S.phase = 'tricks';
          mountRound(); save();
        }else{
          var R2 = roundInfo();
          if(sum(S.cur.made)!==R2.cards) break;
          S.rounds.push({cards:R2.cards, dealer:R2.dealer, bids:S.cur.bids.slice(), made:S.cur.made.slice()});
          if(S.rounds.length>=R2.count){ S.phase='done'; S.cur=null; archive(true); paintAll(); show(); }
          else{
            S.cur = newCur(); S.phase='bids'; archive(false);
            mountRound(); paintSheet(); save();
            window.scrollTo({top:0, behavior: UI.reduced() ? 'auto' : 'smooth'});
          }
        }
        break;

      case 'back': case 'fixlast':
        if(S.phase==='tricks'){ S.phase='bids'; mountRound(); save(); }
        else if(S.rounds.length){
          var last = S.rounds.pop();
          S.cur = {bids:last.bids, made:last.made};
          S.phase='tricks';
          paintAll(); show();
          UI.toast(t('roundUndone'));
        }
        break;

      case 'stop':
        ask(t('stopTitle'), t('stopBody'), t('stopGame'), function(){
          archive(false);
          S.phase='setup'; S.rounds=[]; S.cur=null; S.id=null;
          paintAll(); show();
        });
        break;

      case 'again':
        S.rounds=[]; S.cur=newCur(); S.phase='bids'; S.id='g'+Date.now();
        paintAll(); show();
        break;

      case 'tosetup':
        S.phase='setup'; S.rounds=[]; S.cur=null; S.id=null;
        paintAll(); show();
        break;

      case 'order': S.cfg.stack = (S.cfg.stack === false); paintSheet(); save(); break;
      case 'openrules': paintRules(); UI.openSheet('rules'); break;
      case 'closerules': UI.closeSheet('rules'); break;
      case 'confirmno': UI.closeSheet('confirm'); break;
      case 'confirmyes':
        UI.closeSheet('confirm');
        if(onYes){ var fn = onYes; onYes = null; fn(); }
        break;
    }
  });

  // Re-render in the new language, keeping the game exactly where it was.
  window.addEventListener('jlangchange', paintText);

  paintText();
  show();
})();
</script>
</body>
</html>
