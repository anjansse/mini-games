<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rikiki</title>
<meta name="description" content="Score sheet for the card game Rikiki: bids, tricks, points and past games.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFBF6; --grid:#D9E4F2; --ink:#1B3A9C; --ink-soft:#5B6FA8;
  --red:#C4202B; --pencil:#3A3D45; --fill:#EAF0FB; --on-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1626; --grid:#1B2740; --ink:#AFC4FF; --ink-soft:#7F93C8;
    --red:#FF7B7B; --pencil:#E4E8F2; --fill:#18233C; --on-ink:#0F1626;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1626; --grid:#1B2740; --ink:#AFC4FF; --ink-soft:#7F93C8;
  --red:#FF7B7B; --pencil:#E4E8F2; --fill:#18233C; --on-ink:#0F1626;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--pencil);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;min-height:100vh;line-height:1.4;font-size:16px;-webkit-tap-highlight-color:transparent;
}
#app{max-width:520px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 8px}
.disp{font-family:"Caveat","Bradley Hand","Segoe Script",cursive;font-weight:700;color:var(--ink);line-height:1}
h1{font-size:54px}
h2{font-size:32px;margin:28px 0 10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top .brand{font-size:26px}
.top .sub{margin-left:auto}
.sub{color:var(--ink-soft);font-size:15px}

/* Language toggle. Same markup and key as the rest of the site, so the choice
   carries between the index and every game on the origin. */
.langbar{display:flex;border:1.5px solid var(--ink-soft);border-radius:999px;overflow:hidden;flex:none}
.langbar button{appearance:none;border:0;background:transparent;color:var(--ink-soft);cursor:pointer;
  font:700 12.5px/1 "Atkinson Hyperlegible",system-ui,sans-serif;letter-spacing:.06em;padding:8px 11px;min-height:34px;text-transform:uppercase}
.langbar button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}

.round{margin:14px 0 4px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.round .cards{font-size:64px}
.round .meta{text-align:right;font-size:15px;color:var(--ink-soft)}
.round .meta b{color:var(--pencil)}

.phases{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 12px}
.phases li{padding:9px 6px;border-radius:999px;text-align:center;font-size:14.5px;font-weight:700;border:1.5px solid var(--ink-soft);color:var(--ink-soft);background:var(--paper)}
.phases li.done{border-style:dashed}
.phases li.now{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.phases.p2 li.now{border-color:var(--red);background:var(--red)}
.lead{font-size:34px;margin:4px 2px 10px}
.p2 + .lead{color:var(--red)}

.sheet{background:var(--paper);border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.sheet.p2{border-color:var(--red)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px 8px 14px;border-top:1px solid var(--grid)}
.row:first-child{border-top:0}
.row .who{min-width:0;flex:1}
.row .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .note{font-size:13.5px;color:var(--ink-soft)}
.row .note.bad{color:var(--red);font-weight:700}
.row .note.good{color:var(--ink);font-weight:700}
.ban{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--red);color:var(--on-ink);font-size:14px;font-weight:700}
.free{color:var(--ink-soft)}
.row.dealer{background:var(--fill)}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--fill);color:var(--ink);font-size:13.5px;font-weight:700;margin-right:6px}

.step{display:flex;align-items:center;gap:4px;flex:none}
.step button{display:grid;place-items:center;padding:0;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:700 24px/1 "Atkinson Hyperlegible",system-ui,sans-serif;cursor:pointer}
.step button svg{display:block}
.step button:active{background:var(--fill)}
.step button:disabled{opacity:.25;cursor:default}
.step .val{width:44px;text-align:center;font-size:40px}
.p2 .step .val{color:var(--red)}

.status{margin:12px 2px;font-size:15px;min-height:22px}
.status.bad{color:var(--red);font-weight:700}
.status.ok{color:var(--ink);font-weight:700}

.btn{display:block;width:100%;padding:15px 16px;border-radius:6px;cursor:pointer;font:700 17px/1.2 "Atkinson Hyperlegible",system-ui,sans-serif;border:1.5px solid var(--ink);background:var(--ink);color:var(--on-ink)}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.danger{border-color:var(--red);color:var(--red);background:var(--paper)}
.btns{display:grid;gap:10px;margin-top:12px}
.btns.two{grid-template-columns:1fr 1fr}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--ink-soft);outline-offset:2px}

.players .row{padding:6px 8px 6px 14px}
.players input{flex:1;min-width:0;border:0;border-bottom:1.5px dashed var(--ink-soft);background:transparent;font:700 18px/1.2 "Atkinson Hyperlegible",system-ui,sans-serif;color:var(--pencil);padding:10px 2px;border-radius:0}
.players input::placeholder{color:var(--ink-soft);font-weight:400;opacity:.8}
.x{width:40px;height:40px;border:0;background:transparent;color:var(--red);font-size:22px;cursor:pointer;flex:none}
details{margin-top:18px}
summary{cursor:pointer;color:var(--ink);font-weight:700;padding:8px 2px}
.opt .name{font-weight:400}
.toggle{width:58px;height:34px;border-radius:17px;border:1.5px solid var(--ink);background:transparent;position:relative;cursor:pointer;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:var(--ink-soft);transition:transform .15s}
.toggle[aria-pressed="true"]{background:var(--ink)}
.toggle[aria-pressed="true"]::after{transform:translateX(24px);background:var(--on-ink)}
@media (prefers-reduced-motion:reduce){.toggle::after{transition:none}}

.sheethead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:28px 0 10px}
.sheethead h2{margin:0}
.mini{border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 12px;font:700 13.5px/1 "Atkinson Hyperlegible",system-ui,sans-serif;cursor:pointer}
.mini.danger{border-color:var(--red);color:var(--red)}
details.past{margin-top:10px}
details.past summary{display:block;list-style:none;background:var(--paper);border:1.5px solid var(--ink-soft);border-radius:6px;padding:10px 14px;font-weight:400;color:var(--pencil)}
details.past summary::-webkit-details-marker{display:none}
details.past[open] summary{border-color:var(--ink);margin-bottom:8px}
.pd{display:block;font-size:13.5px;color:var(--ink-soft)}
.pl{display:block;font-weight:700}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;text-align:center;border-top:1px solid var(--grid);border-left:1px solid var(--grid);white-space:nowrap}
tr:first-child th{border-top:0}
th:first-child,td:first-child{border-left:0;position:sticky;left:0;background:var(--paper);color:var(--ink-soft);font-size:14px;font-weight:400;width:1%}
thead th{border-bottom:1.5px solid var(--ink);vertical-align:bottom;font-size:14px;font-weight:700;max-width:92px;overflow:hidden;text-overflow:ellipsis}
thead .tot{display:block;font-size:34px}
thead th.first .tot{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
td .d{display:block;font-size:26px;font-family:"Caveat","Bradley Hand",cursive;font-weight:700;color:var(--ink);line-height:1}
.neg, td .d.neg{color:var(--red)}
td .bm{display:block;font-size:12px;color:var(--ink-soft)}
.empty{padding:18px 14px;color:var(--ink-soft);font-size:15px}
.podium .row .rank{font-size:34px;width:34px;flex:none}
.podium .row .pts{font-size:38px;flex:none}
.home{max-width:520px;margin:0 auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom));text-align:center}
.home a{color:var(--ink-soft);font-size:14px;text-decoration:none;border-bottom:1px dashed var(--ink-soft);padding-bottom:1px}
</style>
<script>
/* Shared language runtime. The key is origin-wide, so choosing a language here
   also changes the index and every other game. Kept inside the app rather than
   injected at build time so that opening this file straight from a git clone
   still works. */
(function(){
  var K='jnssn-lang', LANGS=['en','fr'], DEF='en';
  function stored(){ try{ return localStorage.getItem(K); }catch(e){ return null; } }
  function initial(){
    var s=stored(); if(LANGS.indexOf(s)>-1) return s;
    var nav=(navigator.languages||[navigator.language||'']).join(',').toLowerCase();
    for(var i=0;i<LANGS.length;i++) if(nav.indexOf(LANGS[i])>-1) return LANGS[i];
    return DEF;
  }
  var cur=initial();
  document.documentElement.lang=cur;
  window.JLang={
    langs:LANGS,
    get:function(){ return cur; },
    set:function(l){
      if(LANGS.indexOf(l)<0||l===cur) return;
      cur=l; document.documentElement.lang=l;
      try{ localStorage.setItem(K,l); }catch(e){}
      window.dispatchEvent(new CustomEvent('jlangchange',{detail:l}));
    }
  };
})();
</script>
</head>
<body>
<main id="app"></main>
<nav class="home"><a href="/" id="homelink">&larr; all games</a></nav>
<script>
(function(){
  var KEY = 'rikiki-v1'; // unchanged so a game in progress survives updates
  var app = document.getElementById('app');
  var armed = false;

  /* ---------- strings ----------
     French plurals mark from 2 up ("0 carte", "1 carte", "2 cartes");
     English from anything but 1 ("0 cards", "1 card", "2 cards"). Each
     language therefore brings its own plural helper rather than sharing one. */
  function fp(n, one, many){ return n+' '+(n>1?many:one); }
  function ep(n, one, many){ return n+' '+(n===1?one:many); }

  var L = {
    fr: {
      locale:'fr-BE', docTitle:'Rikiki, feuille de score', home:'← tous les jeux',
      brandSub:'feuille de score', who:'Qui joue ?',
      playerN:function(n){ return 'Joueur '+n; },
      playerLabel:function(n){ return 'Nom du joueur '+n; },
      removePlayer:'Retirer ce joueur',
      dealOrder:'Le premier de la liste donne la première manche, puis ça tourne.',
      addPlayer:'Ajouter un joueur', rules:'Règles de la partie',
      maxCards:'Cartes au maximum',
      roundsTotal:function(n){ return fp(n,'manche','manches')+' au total'; },
      upDown:'Monter puis redescendre',
      forbid:'Pari interdit pour le donneur',
      forbidNote:'Le total des paris ne peut pas égaler le nombre de cartes',
      ptsHit:'Points si pari réussi', ptsPer:'Points par pli gagné',
      ptsPen:'Points perdus par pli d’écart',
      start:'Commencer la partie', recent:'Dernières parties',
      clear:'Effacer', confirm:'Confirmer',
      localOnly:'Tout est enregistré sur cet appareil uniquement. Effacer les données du navigateur efface la partie et l’historique.',
      noHistory:'Aucune partie enregistrée pour l’instant. Les 5 dernières s’affichent ici.',
      stopped:' (arrêtée)',
      roundOf:function(i,n){ return 'Manche '+i+' sur '+n; },
      cards:function(n){ return fp(n,'carte','cartes'); },
      tricks:function(n){ return fp(n,'pli','plis'); },
      rounds:function(n){ return fp(n,'manche','manches'); },
      deals:function(nm){ return '<b>'+nm+'</b> donne'; },
      leads:function(nm){ return '<b>'+nm+'</b> commence'; },
      phase1:'1. Annoncé', phase2:'2. Réalisé',
      bidsLead:'Plis annoncés', tricksLead:'Plis réalisés',
      banned:function(n){ return 'interdit : '+n; },
      dealerFree:'donneur, tout est permis', dealerLast:'donneur, annonce en dernier',
      totalBids:function(t,c){ return 'Total des paris : '+t+' pour '+c+'.'; },
      totalBad:function(n,d){ return 'Le total ne peut pas faire '+n+'. '+d+' doit changer son pari.'; },
      confirmBids:'Valider les annonces',
      bidChip:function(n){ return 'annoncé '+n; },
      pts:function(s){ return s+' pts'; },
      countsOk:'Le compte est bon.',
      needMore:function(d,c){ return 'Partez des annonces et corrigez. Encore '+d+' à attribuer sur '+c+'.'; },
      tooMany:function(s){ return s+' en trop.'; },
      confirmRound:'Valider la manche', theSheet:'La feuille',
      latestTop:'Dernière manche en haut', firstTop:'Première manche en haut',
      orderLabel:'Changer l’ordre des manches',
      sheetEmpty:'Les manches jouées s’inscrivent ici. Sous chaque score : pari / plis faits.',
      colRound:'Manche', goBack:'Revenir en arrière',
      stopGame:'Arrêter la partie', confirmStop:'Confirmer : arrêter',
      done:'Fini !', standings:'Classement',
      again:'Rejouer avec les mêmes joueurs', fixLast:'Corriger la dernière manche',
      changePlayers:'Changer les joueurs ou les règles',
      less:'Moins', more:'Plus'
    },
    en: {
      locale:'en-GB', docTitle:'Rikiki score sheet', home:'← all games',
      brandSub:'score sheet', who:'Who plays?',
      playerN:function(n){ return 'Player '+n; },
      playerLabel:function(n){ return 'Player '+n+' name'; },
      removePlayer:'Remove this player',
      dealOrder:'The first name on the list deals the first round, then it rotates.',
      addPlayer:'Add a player', rules:'Game rules',
      maxCards:'Maximum cards',
      roundsTotal:function(n){ return ep(n,'round','rounds')+' in total'; },
      upDown:'Up then back down',
      forbid:'Dealer bid restriction',
      forbidNote:'The bids cannot add up to the number of cards',
      ptsHit:'Points for a correct bid', ptsPer:'Points per trick won',
      ptsPen:'Points lost per trick off',
      start:'Start the game', recent:'Recent games',
      clear:'Clear', confirm:'Confirm',
      localOnly:'Everything is saved on this device only. Clearing browser data erases the game and the history.',
      noHistory:'No games saved yet. The last 5 show up here.',
      stopped:' (stopped)',
      roundOf:function(i,n){ return 'Round '+i+' of '+n; },
      cards:function(n){ return ep(n,'card','cards'); },
      tricks:function(n){ return ep(n,'trick','tricks'); },
      rounds:function(n){ return ep(n,'round','rounds'); },
      deals:function(nm){ return '<b>'+nm+'</b> deals'; },
      leads:function(nm){ return '<b>'+nm+'</b> leads'; },
      phase1:'1. Bid', phase2:'2. Won',
      bidsLead:'Tricks bid', tricksLead:'Tricks won',
      banned:function(n){ return 'not allowed: '+n; },
      dealerFree:'dealer, anything goes', dealerLast:'dealer, bids last',
      totalBids:function(t,c){ return 'Bids total '+t+' for '+c+'.'; },
      totalBad:function(n,d){ return 'The bids cannot total '+n+'. '+d+' must change their bid.'; },
      confirmBids:'Confirm the bids',
      bidChip:function(n){ return 'bid '+n; },
      pts:function(s){ return s+' pts'; },
      countsOk:'That adds up.',
      needMore:function(d,c){ return 'Work from the bids and adjust. '+d+' still to assign out of '+c+'.'; },
      tooMany:function(s){ return s+' too many.'; },
      confirmRound:'Confirm the round', theSheet:'The sheet',
      latestTop:'Latest round on top', firstTop:'First round on top',
      orderLabel:'Change the round order',
      sheetEmpty:'Rounds you have played appear here. Under each score: bid / tricks won.',
      colRound:'Round', goBack:'Go back',
      stopGame:'Stop the game', confirmStop:'Confirm: stop',
      done:'Done!', standings:'Standings',
      again:'Play again, same players', fixLast:'Fix the last round',
      changePlayers:'Change the players or the rules',
      less:'Minus', more:'Plus'
    }
  };
  function D(){ return L[window.JLang ? window.JLang.get() : 'en'] || L.en; }
  // t('key') for a plain string, t('key', a, b) for one that takes arguments.
  function t(k){
    var v = D()[k];
    if(typeof v !== 'function') return v;
    return v.apply(null, Array.prototype.slice.call(arguments, 1));
  }

  function langBar(){
    var l = window.JLang;
    if(!l || l.langs.length < 2) return '';
    return '<div class="langbar" role="group" aria-label="Language">' + l.langs.map(function(c){
      return '<button type="button" data-lang="'+c+'" aria-pressed="'+(c===l.get())+'">'+c+'</button>';
    }).join('') + '</div>';
  }

  function fresh(){
    return {phase:'setup', players:['','','',''],
      cfg:{max:null, down:true, bonus:10, per:2, pen:2, forbid:true}, rounds:[], cur:null};
  }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(!raw) return null;
      var s = JSON.parse(raw);
      if(!s || !s.players || !s.cfg || !s.rounds) return null;
      if(s.phase==='play'){ s.phase='tricks'; if(s.cur) s.cur.made = s.cur.bids.slice(); }
      return s;
    }catch(e){ return null; }
  }
  // State lives on this device only. localStorage can throw or come back empty
  // (private browsing, cleared site data), so every access is guarded and the
  // app must stay usable when it fails.
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  }

  var S = load() || fresh();
  if(S.phase!=='setup' && !S.id) S.id = 'g'+Date.now();

  // Rolling buffer of the last 5 games, newest first. Separate key so a corrupt game can't take it down.
  var HKEY = 'rikiki-history-v1', HMAX = 5, armedH = false;
  var MEMH = null;
  function loadHistory(){
    if(MEMH) return MEMH;
    try{ var a = JSON.parse(localStorage.getItem(HKEY) || '[]'); MEMH = Array.isArray(a) ? a : []; }catch(e){ MEMH = []; }
    return MEMH;
  }
  function archive(finished){
    if(!S.id || !S.rounds.length) return;
    var H = loadHistory().filter(function(g){ return g.id !== S.id; });
    H.unshift({id:S.id, ts:Date.now(), finished:!!finished, players:S.players.slice(),
               cfg:{bonus:S.cfg.bonus, per:S.cfg.per, pen:S.cfg.pen}, rounds:JSON.parse(JSON.stringify(S.rounds))});
    MEMH = H.slice(0, HMAX);
    try{ localStorage.setItem(HKEY, JSON.stringify(MEMH)); }catch(e){}
  }
  function when(ts){
    try{ return new Date(ts).toLocaleString(t('locale'), {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}); }
    catch(e){ return new Date(ts).toDateString(); }
  }
  function viewHistory(){
    var inGame = S.phase!=='setup';
    var H = loadHistory().filter(function(g){ return !(inGame && g.id===S.id); });
    var h = '<div class="sheethead"><h2 class="disp">'+t('recent')+'</h2>'+
            (H.length?'<button class="mini danger" data-act="clearh">'+(armedH?t('confirm'):t('clear'))+'</button>':'')+'</div>'+
            '<p class="sub" style="margin:0 2px 8px">'+t('localOnly')+'</p>';
    if(!H.length) return h + '<div class="sheet"><div class="empty">'+t('noHistory')+'</div></div>';
    H.forEach(function(g){
      var tt = totals(g), order = g.players.map(function(_,i){return i;}).sort(function(a,b){ return tt[b]-tt[a]; });
      var line = order.map(function(i){ return esc(g.players[i])+' '+tt[i]; }).join(', ');
      h += '<details class="past"><summary><span class="pd">'+esc(when(g.ts))+(g.finished?'':t('stopped'))+'</span><span class="pl">'+line+'</span></summary>'+
           '<div class="sheet">'+tableBody(g, false)+'</div></details>';
    });
    return h;
  }

  function esc(x){ return String(x).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function sum(a){ return a.reduce(function(x,y){ return x+y; }, 0); }
  function sign(n){ return n>0 ? '+'+n : (n<0 ? '−'+Math.abs(n) : '0'); }

  function hardMax(n){ return Math.floor(52/n); }
  function autoMax(n){ return Math.min(10, Math.floor(51/n)); }
  function maxCards(){
    var n = S.players.length, m = S.cfg.max==null ? autoMax(n) : S.cfg.max;
    return Math.max(1, Math.min(m, hardMax(n)));
  }
  function seq(){
    var m = maxCards(), a = [], i;
    for(i=1;i<=m;i++) a.push(i);
    if(S.cfg.down) for(i=m-1;i>=1;i--) a.push(i);
    return a;
  }
  function points(bid, made, cfg){ cfg = cfg || S.cfg; return bid===made ? cfg.bonus + cfg.per*made : -cfg.pen*Math.abs(bid-made); }
  function totals(g){
    g = g || S;
    var tt = g.players.map(function(){ return 0; });
    g.rounds.forEach(function(r){ r.bids.forEach(function(b,i){ tt[i] += points(b, r.made[i], g.cfg); }); });
    return tt;
  }
  function roundInfo(){
    var i = S.rounds.length, n = S.players.length, s = seq();
    var dealer = i % n, order = [];
    for(var k=1;k<=n;k++) order.push((dealer+k)%n);
    return {idx:i, count:s.length, cards:s[i], dealer:dealer, order:order};
  }
  function zeros(){ return S.players.map(function(){return 0;}); }
  function newCur(){ return {bids:zeros(), made:zeros()}; }

  var ICON_MINUS = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>';
  var ICON_PLUS  = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>';
  // skip = a value the stepper may never land on (the dealer's forbidden bid)
  function nextAllowed(v, d, min, max, skip){
    var n = v + d; if(n===skip) n += d;
    return (n<min || n>max) ? null : n;
  }
  function stepper(kind, i, v, min, max, skip){
    if(skip==null) skip = -99;
    return '<div class="step">'+
      '<button data-act="dec" data-kind="'+kind+'" data-i="'+i+'" aria-label="'+esc(t('less'))+'"'+(nextAllowed(v,-1,min,max,skip)==null?' disabled':'')+'>'+ICON_MINUS+'</button>'+
      '<span class="val disp" aria-live="polite">'+v+'</span>'+
      '<button data-act="inc" data-kind="'+kind+'" data-i="'+i+'" aria-label="'+esc(t('more'))+'"'+(nextAllowed(v,1,min,max,skip)==null?' disabled':'')+'>'+ICON_PLUS+'</button>'+
    '</div>';
  }
  // The dealer's forbidden bid for the current round, or null when nothing is forbidden.
  function forbiddenBid(R){
    if(!S.cfg.forbid) return null;
    var f = R.cards - (sum(S.cur.bids) - S.cur.bids[R.dealer]);
    return (f>=0 && f<=R.cards) ? f : null;
  }
  // Never leave the dealer sitting on the forbidden number.
  function fixDealer(R){
    var f = forbiddenBid(R), b = S.cur.bids;
    if(f!=null && b[R.dealer]===f) b[R.dealer] = (f+1<=R.cards) ? f+1 : f-1;
  }

  function viewSetup(){
    var n = S.players.length, h = '';
    h += '<div class="top"><h1 class="disp">Rikiki</h1>'+langBar()+'</div>';
    h += '<p class="sub" style="margin:6px 2px 0">'+t('brandSub')+'</p>';
    h += '<h2 class="disp">'+t('who')+'</h2><div class="sheet players">';
    S.players.forEach(function(p,i){
      h += '<div class="row"><input type="text" autocomplete="off" autocapitalize="words" maxlength="14" data-name="'+i+'" value="'+esc(p)+'" placeholder="'+esc(t('playerN',i+1))+'" aria-label="'+esc(t('playerLabel',i+1))+'">'+
        (n>2 ? '<button class="x" data-act="rm" data-i="'+i+'" aria-label="'+esc(t('removePlayer'))+'">×</button>' : '')+'</div>';
    });
    h += '</div><p class="sub" style="margin:10px 2px">'+t('dealOrder')+'</p>';
    if(n<7) h += '<div class="btns"><button class="btn ghost" data-act="add">'+t('addPlayer')+'</button></div>';

    h += '<details'+(S.cfg._open?' open':'')+'><summary>'+t('rules')+'</summary><div class="sheet" style="margin-top:8px">';
    h += '<div class="row opt"><div class="who"><div class="name">'+t('maxCards')+'</div><div class="note">'+t('roundsTotal',seq().length)+'</div></div>'+stepper('max',0,maxCards(),1,hardMax(n))+'</div>';
    h += '<div class="row opt"><div class="who"><div class="name">'+t('upDown')+'</div></div><button class="toggle" data-act="tog" data-k="down" aria-pressed="'+S.cfg.down+'" aria-label="'+esc(t('upDown'))+'"></button></div>';
    h += '<div class="row opt"><div class="who"><div class="name">'+t('forbid')+'</div><div class="note">'+t('forbidNote')+'</div></div><button class="toggle" data-act="tog" data-k="forbid" aria-pressed="'+S.cfg.forbid+'" aria-label="'+esc(t('forbid'))+'"></button></div>';
    h += '<div class="row opt"><div class="who"><div class="name">'+t('ptsHit')+'</div></div>'+stepper('bonus',0,S.cfg.bonus,0,50)+'</div>';
    h += '<div class="row opt"><div class="who"><div class="name">'+t('ptsPer')+'</div></div>'+stepper('per',0,S.cfg.per,0,20)+'</div>';
    h += '<div class="row opt"><div class="who"><div class="name">'+t('ptsPen')+'</div></div>'+stepper('pen',0,S.cfg.pen,0,20)+'</div>';
    h += '</div></details>';
    h += '<div class="btns" style="margin-top:22px"><button class="btn" data-act="start">'+t('start')+'</button></div>';
    h += viewHistory();
    return h;
  }

  function viewTable(){
    var h = '';
    var stack = S.cfg.stack !== false;
    h += '<div class="sheethead"><h2 class="disp">'+t('theSheet')+'</h2>'+
         (S.rounds.length>1 ? '<button class="mini" data-act="order" aria-label="'+esc(t('orderLabel'))+'">'+(stack?t('latestTop'):t('firstTop'))+' ⇅</button>' : '')+
         '</div><div class="sheet">';
    if(!S.rounds.length) return h + '<div class="empty">'+t('sheetEmpty')+'</div></div>';
    return h + tableBody(S, stack) + '</div>';
  }
  function tableBody(g, stack){
    var tt = totals(g), best = Math.max.apply(null, tt), h = '';
    h += '<div class="scroll"><table><thead><tr><th scope="col">'+t('colRound')+'</th>';
    g.players.forEach(function(p,i){
      h += '<th scope="col" class="'+(tt[i]===best?'first':'')+'">'+esc(p)+'<span class="tot disp'+(tt[i]<0?' neg':'')+'">'+tt[i]+'</span></th>';
    });
    h += '</tr></thead><tbody>';
    var list = g.rounds.map(function(r,k){ return {r:r,k:k}; });
    if(stack) list.reverse();
    list.forEach(function(o){
      var r = o.r;
      h += '<tr><td>'+(o.k+1)+'<span class="bm">'+t('cards',r.cards)+'</span></td>';
      r.bids.forEach(function(b,i){
        var d = points(b, r.made[i], g.cfg);
        h += '<td><span class="d'+(d<0?' neg':'')+'">'+sign(d)+'</span><span class="bm">'+b+' / '+r.made[i]+'</span></td>';
      });
      h += '</tr>';
    });
    return h + '</tbody></table></div>';
  }

  function phases(now){
    var names = [t('phase1'), t('phase2')], idx = {bids:0, tricks:1}[now], h = '<ol class="phases'+(idx===1?' p2':'')+'">';
    names.forEach(function(nm,k){ h += '<li class="'+(k<idx?'done':k===idx?'now':'')+'"'+(k===idx?' aria-current="step"':'')+'>'+nm+'</li>'; });
    return h + '</ol>';
  }

  function viewGame(){
    var R = roundInfo(), c = S.cur, ph = S.phase, h = '';
    var dealer = esc(S.players[R.dealer]), first = esc(S.players[R.order[0]]);
    h += '<div class="top"><span class="disp brand">Rikiki</span><span class="sub">'+t('roundOf',R.idx+1,R.count)+'</span>'+langBar()+'</div>';
    h += '<div class="round"><div class="cards disp">'+t('cards',R.cards)+'</div>'+
         '<div class="meta">'+t('deals',dealer)+'<br>'+t('leads',first)+'</div></div>';
    h += phases(ph);

    var totalBids = sum(c.bids), ok = true, msg = '', mcls = '', cta = '', act = '';

    if(ph==='bids'){
      fixDealer(R);
      totalBids = sum(c.bids);
      var forbidden = forbiddenBid(R);
      h += '<p class="lead disp">'+t('bidsLead')+'</p><div class="sheet">';
      R.order.forEach(function(i){
        var note = '', isDealer = i===R.dealer;
        if(isDealer && S.cfg.forbid){
          note = forbidden!=null ? '<span class="ban">'+t('banned',forbidden)+'</span>' : '<span class="free">'+t('dealerFree')+'</span>';
        }else if(isDealer){ note = t('dealerLast'); }
        h += '<div class="row'+(isDealer?' dealer':'')+'"><div class="who"><div class="name">'+esc(S.players[i])+'</div><div class="note">'+note+'</div></div>'+stepper('bid',i,c.bids[i],0,R.cards,isDealer?forbidden:null)+'</div>';
      });
      h += '</div>';
      ok = !(S.cfg.forbid && totalBids===R.cards);
      msg = ok ? t('totalBids', totalBids, t('cards',R.cards)) : t('totalBad', R.cards, dealer);
      if(!ok) mcls='bad';
      cta = t('confirmBids'); act = 'lock';
    }
    else{
      var made = sum(c.made), diff = R.cards - made; ok = diff===0;
      h += '<p class="lead disp">'+t('tricksLead')+'</p><div class="sheet p2">';
      R.order.forEach(function(i){
        var p = points(c.bids[i], c.made[i]);
        var res = '<span class="note '+(p<0?'bad':'good')+'">'+t('pts',sign(p))+'</span>';
        h += '<div class="row"><div class="who"><div class="name">'+esc(S.players[i])+'</div><div class="note"><span class="chip">'+t('bidChip',c.bids[i])+'</span>'+res+'</div></div>'+stepper('made',i,c.made[i],0,R.cards)+'</div>';
      });
      h += '</div>';
      msg = ok ? t('countsOk') : (diff>0 ? t('needMore', t('tricks',diff), t('cards',R.cards)) : t('tooMany', t('tricks',-diff)));
      mcls = ok ? 'ok' : 'bad';
      cta = t('confirmRound'); act = 'score';
    }

    if(msg) h += '<p class="status '+mcls+'" role="status">'+msg+'</p>';
    h += '<div class="btns"><button class="btn" data-act="'+act+'"'+(ok?'':' disabled')+'>'+cta+'</button></div>';
    h += viewTable();
    h += '<div class="btns two" style="margin-top:16px">'+
         '<button class="btn ghost" data-act="back"'+((ph==='bids' && !S.rounds.length)?' disabled':'')+'>'+t('goBack')+'</button>'+
         '<button class="btn danger" data-act="quit">'+(armed?t('confirmStop'):t('stopGame'))+'</button></div>';
    h += viewHistory();
    return h;
  }

  function viewDone(){
    var tt = totals(), order = S.players.map(function(_,i){return i;}).sort(function(a,b){ return tt[b]-tt[a]; }), h = '';
    h += '<div class="top"><h1 class="disp">'+t('done')+'</h1>'+langBar()+'</div>';
    h += '<p class="sub" style="margin:6px 2px 0">'+t('rounds',S.rounds.length)+'</p>';
    h += '<h2 class="disp">'+t('standings')+'</h2><div class="sheet podium">';
    var rank = 0, prev = null;
    order.forEach(function(i,k){
      if(tt[i]!==prev){ rank = k+1; prev = tt[i]; }
      h += '<div class="row"><span class="rank disp">'+rank+'</span><div class="who"><div class="name">'+esc(S.players[i])+'</div></div><span class="pts disp'+(tt[i]<0?' neg':'')+'">'+tt[i]+'</span></div>';
    });
    h += '</div>' + viewTable();
    h += '<div class="btns" style="margin-top:18px"><button class="btn" data-act="again">'+t('again')+'</button>'+
         '<button class="btn ghost" data-act="back">'+t('fixLast')+'</button>'+
         '<button class="btn ghost" data-act="setup">'+t('changePlayers')+'</button></div>';
    h += viewHistory();
    return h;
  }

  function render(){
    document.title = t('docTitle');
    document.getElementById('homelink').innerHTML = t('home');
    app.innerHTML = S.phase==='setup' ? viewSetup() : S.phase==='done' ? viewDone() : viewGame();
    save();
  }

  function bump(kind, i, d){
    if(kind==='bid' || kind==='made'){
      var R = roundInfo(), arr = kind==='bid' ? S.cur.bids : S.cur.made;
      if(kind==='bid'){
        var skip = (i===R.dealer) ? forbiddenBid(R) : null;
        var n = nextAllowed(arr[i], d, 0, R.cards, skip==null ? -99 : skip);
        if(n!=null) arr[i] = n;
        fixDealer(R);
      }else{
        arr[i] = Math.max(0, Math.min(R.cards, arr[i]+d));
      }
    }else if(kind==='max'){
      S.cfg.max = Math.max(1, Math.min(hardMax(S.players.length), maxCards()+d));
    }else{
      S.cfg[kind] = Math.max(0, Math.min(kind==='bonus'?50:20, S.cfg[kind]+d));
    }
  }

  document.addEventListener('input', function(e){
    var i = e.target.getAttribute && e.target.getAttribute('data-name');
    if(i!=null){ S.players[+i] = e.target.value; save(); }
  });
  document.addEventListener('toggle', function(e){
    if(e.target.tagName==='DETAILS' && !e.target.classList.contains('past')){ S.cfg._open = e.target.open; save(); }
  }, true);

  // Re-render in the new language, keeping the game exactly where it was.
  window.addEventListener('jlangchange', render);

  document.addEventListener('click', function(e){
    var lb = e.target.closest && e.target.closest('[data-lang]');
    if(lb){ if(window.JLang) window.JLang.set(lb.getAttribute('data-lang')); return; }

    var b = e.target.closest && e.target.closest('[data-act]');
    if(!b || b.disabled) return;
    var act = b.getAttribute('data-act'), i = +b.getAttribute('data-i'), top = false;
    if(act!=='quit') armed = false;
    if(act!=='clearh') armedH = false;

    switch(act){
      case 'inc': bump(b.getAttribute('data-kind'), i, 1); break;
      case 'dec': bump(b.getAttribute('data-kind'), i, -1); break;
      case 'add': if(S.players.length<7) S.players.push(''); break;
      case 'rm':  if(S.players.length>2) S.players.splice(i,1); break;
      case 'order': S.cfg.stack = (S.cfg.stack === false); break;
      case 'tog': var k = b.getAttribute('data-k'); S.cfg[k] = !S.cfg[k]; break;
      case 'start':
        S.players = S.players.map(function(p,j){ return p.trim() || t('playerN', j+1); });
        S.cfg.max = maxCards(); S.rounds = []; S.cur = newCur(); S.phase = 'bids'; S.id = 'g'+Date.now(); top = true; break;
      case 'lock': S.cur.made = S.cur.bids.slice(); S.phase = 'tricks'; top = true; break;
      case 'score':
        var R = roundInfo();
        if(sum(S.cur.made)!==R.cards) break;
        S.rounds.push({cards:R.cards, dealer:R.dealer, bids:S.cur.bids.slice(), made:S.cur.made.slice()});
        if(S.rounds.length>=R.count){ S.phase='done'; S.cur=null; archive(true); } else { S.cur = newCur(); S.phase='bids'; archive(false); }
        top = true; break;
      case 'back':
        if(S.phase==='tricks') S.phase='bids';
        else if(S.rounds.length){ var last = S.rounds.pop(); S.cur = {bids:last.bids, made:last.made}; S.phase='tricks'; }
        top = true; break;
      case 'quit':
        if(!armed) armed = true;
        else { armed = false; archive(false); S.phase='setup'; S.rounds=[]; S.cur=null; S.id=null; top = true; }
        break;
      case 'again': S.rounds=[]; S.cur=newCur(); S.phase='bids'; S.id='g'+Date.now(); top = true; break;
      case 'clearh': if(!armedH) armedH = true; else { armedH = false; MEMH = []; try{ localStorage.removeItem(HKEY); }catch(e){} } break;
      case 'setup': S.phase='setup'; S.rounds=[]; S.cur=null; S.id=null; top = true; break;
    }
    render();
    if(top) window.scrollTo(0,0);
  });

  render();
})();
</script>
</body>
</html>
